title: Slow Cooker Chicken Cacciatore
source: Erin Clarke (Well Plated)
url: https://www.wellplated.com/slow-cooker-chicken-cacciatore/
times:
  prep: 15 minutes
  cook: 4 hours
servings: "4–6"
ingredients:
  - name: null
    items:
      - "1 tablespoon extra-virgin olive oil plus 2 teaspoons, divided"
      - "2 pounds boneless skinless chicken breasts or thighs"
      - "1 teaspoon kosher salt"
      - "½ teaspoon ground black pepper"
      - "1 medium yellow onion chopped"
      - "3 cloves garlic minced"
      - "1 tablespoon balsamic vinegar plus 1/2 teaspoon, divided"
      - "1 can crushed tomatoes 28 ounces"
      - "1 medium green bell pepper chopped"
      - "8 ounces sliced baby bella cremini mushrooms"
      - "2 teaspoons Italian seasoning"
  - name: For Serving
    items:
      - "Whole wheat pasta brown rice, polenta, rice, zucchini noodles, or baked and shredded spaghetti squash"
      - "Chopped fresh parsley freshly grated Parmesan cheese"
instructions:
  - lead: "Sear the chicken."
    detail: "Lightly spray a large slow cooker with nonstick spray. In a large skillet over medium-high heat, warm 1 tablespoon of olive oil. Season both sides of the chicken with salt and pepper. When the oil is hot and shimmering, lay the chicken in a single layer and let it cook undisturbed for 3–4 minutes to develop a good sear, then flip and brown the second side for about 2 more minutes. Move the chicken to the slow cooker."
  - lead: "Soften the aromatics."
    detail: "Lower the skillet heat to medium and carefully wipe out the pan with a paper towel. Add the remaining 2 teaspoons of olive oil, then the onion, and cook for about 3 minutes until it begins to soften. Stir in the garlic and 1 tablespoon balsamic vinegar and cook for 1 minute, until the garlic is fragrant and the vinegar has reduced. Scrape everything — pan drippings included — into the slow cooker."
  - lead: "Slow cook with the vegetables."
    detail: "Top the chicken with the crushed tomatoes, green bell pepper, mushrooms, and Italian seasoning. For chicken breasts, cover and cook on HIGH for 1½–2½ hours or on LOW for 4–5 hours; for chicken thighs, cook on HIGH for 3–4 hours or on LOW for 5–6 hours. Pull the chicken out as soon as it reaches 165°F. Optionally chop or shred it, or leave the pieces whole."
  - lead: "Thicken and finish the sauce."
    detail: "You can serve immediately, but for the best flavor, uncover the slow cooker and cook on HIGH for 1 more hour to thicken the sauce and deepen its flavor. Just before serving, stir in the remaining ½ teaspoon balsamic vinegar and adjust salt and pepper to taste. If the chicken was chopped or shredded, return it to the sauce and toss to warm through; otherwise spoon sauce generously over whole pieces. Serve hot over pasta, rice, polenta, or veggie noodles, finished with extra sauce, parsley, and Parmesan."
